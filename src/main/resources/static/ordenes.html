<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar pedidos - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .crud-section { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .crud-toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .crud-toolbar input, .crud-toolbar select { padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 14px; }
        .crud-toolbar .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary-crud { background: #f5a623; color: #1a1a1a; }
        .btn-primary-crud:hover { background: #e09520; }
        .btn-secondary { background: #333; color: white; border: 1px solid #555; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .crud-table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .crud-table th, .crud-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #333; }
        .crud-table th { background: #222; color: #f5a623; font-weight: bold; }
        .crud-table tr:hover { background: #252525; }
        .crud-table .actions { display: flex; gap: 8px; }
        .crud-table .actions button { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; }
        .empty-msg { text-align: center; padding: 40px; color: #888; }
        .search-group { display: flex; gap: 8px; align-items: center; }
        .search-group label { color: #aaa; font-size: 13px; }
        .estado-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .estado-pendiente { background: #f5a62333; color: #f5a623; }
        .estado-pagado { background: #28a74533; color: #28a745; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.hidden { display: none !important; }
        .modal-box { background: #1a1a1a; border-radius: 12px; padding: 24px; min-width: 400px; max-width: 520px; border: 1px solid #333; }
        .modal-box h3 { margin-bottom: 20px; color: #f5a623; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        .form-group input:disabled { opacity: 0.7; cursor: not-allowed; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    </style>
</head>
<body class="panel-admin-body">

    <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-sidebar-header">
            <a href="/" class="admin-logo">
                <span class="admin-logo-icon">U</span>
                <span class="admin-logo-text">UNISOF</span>
            </a>
        </div>
        <nav class="admin-nav">
            <a href="/ventas.html" class="admin-nav-item" data-section="ventas">
                <span class="admin-nav-icon">💼</span>
                <span class="admin-nav-text" data-i18n-key="nav.sales">Ventas</span>
            </a>
            <a href="/clientes.html" class="admin-nav-item" data-section="clientes">
                <span class="admin-nav-icon">👥</span>
                <span class="admin-nav-text" data-i18n-key="nav.clients">Clientes</span>
            </a>
            <a href="/ordenes.html" class="admin-nav-item active" data-section="ordenes">
                <span class="admin-nav-icon">📋</span>
                <span class="admin-nav-text" data-i18n-key="nav.requests">Pedidos</span>
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <div class="admin-user-info" id="admin-sidebar-user">
                <span class="admin-user-name" id="user-name">—</span>
                <span class="admin-user-rol" id="user-rol">VENDEDOR</span>
            </div>
            <button type="button" class="admin-btn-logout" id="btn-logout" data-i18n-key="common.logout">Cerrar sesión</button>
        </div>
    </aside>

        <div class="admin-main-wrap">
        <header class="admin-topbar">
            <h1 class="admin-topbar-title" data-i18n-key="title.orders">Pedidos</h1>
        </header>

        <main class="admin-dashboard">
        <div class="panel-main">
        <h1 class="panel-title" data-i18n-key="orders.consultTitle">Consultar pedidos</h1>
        <div class="crud-section">
            <div class="crud-toolbar">
                <div class="search-group">
                    <label data-i18n-key="orders.orderNo">Nº orden:</label>
                    <input type="text" id="buscar-numero" placeholder="001, 002, 003..." style="width: 100px;">
                    <button type="button" class="btn btn-secondary" id="btn-buscar-numero" data-i18n-key="orders.searchByNo">Buscar</button>
                </div>
                <div class="search-group">
                    <label data-i18n-key="orders.cedula">Cédula:</label>
                    <input type="text" id="buscar-cedula" data-i18n-placeholder="orders.idPlaceholder" placeholder="Número de identificación" style="width: 160px;">
                    <button type="button" class="btn btn-secondary" id="btn-buscar-cedula" data-i18n-key="orders.byCedula">Por cédula</button>
                </div>
                <div class="search-group">
                    <label data-i18n-key="orders.date">Fecha:</label>
                    <input type="date" id="buscar-fecha" style="width: 160px;">
                    <button type="button" class="btn btn-secondary" id="btn-buscar-fecha" data-i18n-key="orders.byDate">Por fecha</button>
                </div>
                <div class="search-group">
                    <label data-i18n-key="orders.month">Mes:</label>
                    <input type="month" id="buscar-mes" style="width: 160px;">
                    <button type="button" class="btn btn-secondary" id="btn-buscar-mes" data-i18n-key="orders.byMonth">Por mes</button>
                </div>
                <button type="button" class="btn btn-primary-crud" id="btn-listar-todos" data-i18n-key="orders.listAll">Listar todas</button>
            </div>
            <div id="tabla-container">
                <table class="crud-table" id="tabla-ordenes">
                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th data-i18n-key="orders.client">Cliente</th>
                            <th data-i18n-key="orders.date">Fecha</th>
                            <th data-i18n-key="orders.total">Total</th>
                            <th data-i18n-key="orders.status">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                </table>
                <p class="empty-msg" id="empty-msg" style="display:none;" data-i18n-key="orders.empty">No hay pedidos. Los pedidos se crean desde el carrito en Ventas.</p>
            </div>
        </div>
        </div>
        </main>
    </div>

    <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Abrir menú">☰</button>

    <script src="/js/auth.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/accessibility.js"></script>
    <script>
        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) { window.location.href = '/login.html'; return; }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (rol !== 'VENDEDOR') { window.location.href = '/'; return; }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent = result.usuario?.rol || 'VENDEDOR';
        })();

        document.getElementById('btn-logout').addEventListener('click', async () => {
            const confirmar = window.confirm('¿Desea cerrar sesión?');
            if (!confirmar) return;
            await authApi.logout();
            window.location.href = '/';
        });

        // Sidebar móvil igual que en ventas/panel-admin
        const sidebar = document.getElementById('admin-sidebar');
        const toggle = document.getElementById('admin-sidebar-toggle');
        if (toggle && sidebar) {
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                toggle.setAttribute('aria-label', sidebar.classList.contains('open') ? 'Cerrar menú' : 'Abrir menú');
            });
        }

        function formatFecha(isoStr) {
            if (!isoStr) return '—';
            try {
                const d = new Date(isoStr);
                return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (_) { return isoStr; }
        }

        function formatTotal(n) {
            if (n == null) return '—';
            return new Intl.NumberFormat('es-CO').format(n) + ' COP';
        }

        async function cargarOrdenes(params = {}) {
            try {
                const qs = new URLSearchParams(params).toString();
                const url = '/api/recibos' + (qs ? '?' + qs : '');
                const res = await fetch(url, { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al cargar');
                renderTabla(Array.isArray(data) ? data : [data]);
            } catch (err) {
                Toast.error(err.message || 'Error al cargar órdenes');
                renderTabla([]);
            }
        }

        document.getElementById('btn-listar-todos').addEventListener('click', () => cargarOrdenes());

        document.getElementById('btn-buscar-numero').addEventListener('click', () => {
            const num = document.getElementById('buscar-numero').value.trim();
            if (!num) { Toast.error('Ingresa un número de orden'); return; }
            cargarOrdenes({ numero: num });
        });

        document.getElementById('btn-buscar-cedula').addEventListener('click', () => {
            const cedula = document.getElementById('buscar-cedula').value.trim();
            if (!cedula) { Toast.error('Ingresa una cédula'); return; }
            cargarOrdenes({ cedula });
        });

        document.getElementById('btn-buscar-fecha').addEventListener('click', () => {
            const fecha = document.getElementById('buscar-fecha').value;
            if (!fecha) { Toast.error('Selecciona una fecha'); return; }
            cargarOrdenes({ fecha });
        });

        document.getElementById('btn-buscar-mes').addEventListener('click', () => {
            const mes = document.getElementById('buscar-mes').value;
            if (!mes) { Toast.error('Selecciona un mes'); return; }
            cargarOrdenes({ mes });
        });

        function renderTabla(ordenes) {
            const tbody = document.getElementById('tabla-body');
            const emptyMsg = document.getElementById('empty-msg');
            tbody.innerHTML = '';
            if (ordenes.length === 0) {
                document.getElementById('tabla-ordenes').style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }
            document.getElementById('tabla-ordenes').style.display = 'table';
            emptyMsg.style.display = 'none';
            ordenes.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${o.numeroFormateado || ('00' + o.numero).slice(-3)}</strong></td>
                    <td>${escapeHtml(o.clienteNombre || '—')}</td>
                    <td>${formatFecha(o.fecha)}</td>
                    <td>${formatTotal(o.total)}</td>
                    <td><span class="estado-badge estado-pagado">Pagado</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        cargarOrdenes();
    </script>
</body>
</html>
