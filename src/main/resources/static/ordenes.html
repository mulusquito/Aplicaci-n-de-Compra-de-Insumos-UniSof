<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar pedidos - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .crud-section { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .crud-toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .crud-toolbar input, .crud-toolbar select { padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 14px; }
        .crud-toolbar .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary-crud { background: #f5a623; color: #1a1a1a; }
        .btn-primary-crud:hover { background: #e09520; }
        .btn-secondary { background: #333; color: white; border: 1px solid #555; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .crud-table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .crud-table th, .crud-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #333; }
        .crud-table th { background: #222; color: #f5a623; font-weight: bold; }
        .crud-table tr:hover { background: #252525; }
        .crud-table .actions { display: flex; gap: 8px; }
        .crud-table .actions button { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; }
        .empty-msg { text-align: center; padding: 40px; color: #888; }
        .search-group { display: flex; gap: 8px; align-items: center; }
        .search-group label { color: #aaa; font-size: 13px; }
        .estado-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .estado-pendiente { background: #f5a62333; color: #f5a623; }
        .estado-pagado { background: #28a74533; color: #28a745; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.hidden { display: none !important; }
        .modal-box { background: #1a1a1a; border-radius: 12px; padding: 24px; min-width: 400px; max-width: 520px; border: 1px solid #333; }
        .modal-box h3 { margin-bottom: 20px; color: #f5a623; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        .form-group input:disabled { opacity: 0.7; cursor: not-allowed; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
.pedido-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto; }
        .pedido-modal-overlay.hidden { display: none !important; }
        .pedido-modal { background: #1a1a1a; border-radius: 12px; max-width: 520px; width: 100%; border: 1px solid #333; overflow: hidden; max-height: 90vh; overflow-y: auto; }
        .pedido-modal-header { background: #f5a623; color: #1a1a1a; padding: 20px; text-align: center; }
        .pedido-modal-header .logo-u { display: inline-block; width: 40px; height: 40px; line-height: 40px; background: #1a1a1a; color: #f5a623; border-radius: 8px; font-weight: bold; margin-right: 8px; }
        .pedido-modal-header .titulo { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .pedido-modal-body { padding: 24px; }
        .pedido-modal-body .subtitulo { text-align: center; color: #888; font-size: 12px; margin-bottom: 4px; }
        .pedido-modal-body .numero-orden { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 16px; }
        .pedido-modal-body .fechas { font-size: 12px; color: #aaa; margin-bottom: 16px; }
        .pedido-modal-body h3 { font-size: 13px; color: #f5a623; margin: 16px 0 8px; }
        .pedido-modal-body .cliente-datos p { margin: 4px 0; font-size: 13px; color: #ccc; }
        .pedido-modal-body .tabla-productos { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .pedido-modal-body .tabla-productos th { text-align: left; padding: 8px 0; border-bottom: 1px solid #333; color: #888; }
        .pedido-modal-body .tabla-productos td { padding: 6px 0; border-bottom: 1px solid #2a2a2a; color: #ddd; }
        .pedido-modal-body .total-line { text-align: right; font-size: 16px; font-weight: bold; color: #f5a623; margin-top: 16px; }
        .pedido-modal-body .vendedor-line { font-size: 13px; color: #888; margin-top: 8px; }
        .pedido-modal-footer { background: #111; padding: 12px; text-align: center; font-size: 11px; color: #666; }
        .btn-ver-pedido { padding: 6px 14px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; background: #f5a623; color: #1a1a1a; font-weight: 600; }
        .btn-ver-pedido:hover { background: #e09520; }
        .modal-recibo-total-wrap { margin-top: 16px; }
        .modal-recibo-total { text-align: right; font-size: 16px; font-weight: bold; color: #f5a623; margin: 0 0 8px; }
        .modal-recibo-vendedor { font-size: 13px; color: #888; margin: 0; }
        /* Móvil: consulta pedidos – uno abajo del otro, alineados y simétricos */
        @media (max-width: 768px) {
            .crud-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                margin-bottom: 24px;
            }
            .crud-toolbar .search-group {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .crud-toolbar .search-group label {
                margin-bottom: 0;
            }
            .crud-toolbar input,
            .crud-toolbar select,
            .crud-toolbar .btn {
                width: 100% !important;
                max-width: 100%;
                box-sizing: border-box;
            }
            .crud-toolbar .btn-primary-crud {
                width: 100%;
                padding: 12px 20px;
                text-align: center;
            }
        }
    </style>
</head>

    <script src="/js/auth.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/accessibility.js"></script>
    <script>
        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) { window.location.href = '/login.html'; return; }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (rol !== 'VENDEDOR' && rol !== 'ADMINISTRADOR') { window.location.href = '/'; return; }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent = result.usuario?.rol || rol;
            if (rol === 'ADMINISTRADOR') {
                document.querySelector('.admin-topbar-title').textContent = 'Consultar órdenes de compra';
                const nav = document.getElementById('admin-nav');
                nav.innerHTML = `
                    <a href="/panel-admin.html" class="admin-nav-item" data-section="dashboard">
                        <span class="admin-nav-icon">📊</span>
                        <span class="admin-nav-text">Dashboard</span>
                    </a>
                    <a href="/personal.html" class="admin-nav-item" data-section="personal">
                        <span class="admin-nav-icon">👤</span>
                        <span class="admin-nav-text">Personal</span>
                    </a>
                    <a href="/ordenes.html" class="admin-nav-item active" data-section="ordenes">
                        <span class="admin-nav-icon">📋</span>
                        <span class="admin-nav-text">Consultar órdenes de compra</span>
                    </a>
                    <a href="#compras-insumos" class="admin-nav-item admin-nav-item--disabled"><span class="admin-nav-icon">📦</span><span class="admin-nav-text">Consultar compras insumos</span><span class="admin-nav-hint">(Próximamente)</span></a>
                    <a href="#inventario" class="admin-nav-item admin-nav-item--disabled"><span class="admin-nav-icon">📁</span><span class="admin-nav-text">Consultar inventario</span><span class="admin-nav-hint">(Próximamente)</span></a>
                `;
            }
        })();

        document.getElementById('btn-logout').addEventListener('click', async () => {
            const confirmar = window.confirm('¿Desea cerrar sesión?');
            if (!confirmar) return;
            await authApi.logout();
            window.location.href = '/';
        });

        // Sidebar móvil igual que en ventas/panel-admin
        const sidebar = document.getElementById('admin-sidebar');
        const toggle = document.getElementById('admin-sidebar-toggle');
        if (toggle && sidebar) {
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                toggle.setAttribute('aria-label', sidebar.classList.contains('open') ? 'Cerrar menú' : 'Abrir menú');
            });
        }

        function formatFecha(isoStr) {
            if (!isoStr) return '—';
            try {
                const d = new Date(isoStr);
                return d.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (_) { return isoStr; }
        }

        function formatTotal(n) {
            if (n == null) return '—';
            return new Intl.NumberFormat('es-CO').format(n) + ' COP';
        }

        let ultimoContexto = 'todos';

        async function cargarOrdenes(params = {}) {
            try {
                const qs = new URLSearchParams(params).toString();
                const url = '/api/recibos' + (qs ? '?' + qs : '');
                const res = await fetch(url, { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al cargar');
                renderTabla(Array.isArray(data) ? data : [data]);
            } catch (err) {
                Toast.error(err.message || 'Error al cargar órdenes');
                renderTabla([]);
            }
        }

        document.getElementById('btn-listar-todos').addEventListener('click', () => {
            ultimoContexto = 'todos';
            cargarOrdenes();
        });

        document.getElementById('btn-buscar-numero').addEventListener('click', () => {
            const num = document.getElementById('buscar-numero').value.trim();
            if (!num) { Toast.error('Ingresa un número de orden'); return; }
            ultimoContexto = 'numero';
            cargarOrdenes({ numero: num });
        });

        document.getElementById('btn-buscar-cedula').addEventListener('click', () => {
            const cedula = document.getElementById('buscar-cedula').value.trim();
            if (!cedula) { Toast.error('Ingresa una cédula'); return; }
            ultimoContexto = 'cedula';
            cargarOrdenes({ cedula });
        });

        document.getElementById('btn-buscar-fecha').addEventListener('click', () => {
            const fecha = document.getElementById('buscar-fecha').value;
            if (!fecha) { Toast.error('Selecciona una fecha'); return; }
            ultimoContexto = 'fecha';
            cargarOrdenes({ fecha });
        });

        document.getElementById('btn-buscar-mes').addEventListener('click', () => {
            const mes = document.getElementById('buscar-mes').value;
            if (!mes) { Toast.error('Selecciona un mes'); return; }
            ultimoContexto = 'mes';
            cargarOrdenes({ mes });
        });

        function renderTabla(ordenes) {
            const tbody = document.getElementById('tabla-body');
            const emptyMsg = document.getElementById('empty-msg');
            tbody.innerHTML = '';
            if (ordenes.length === 0) {
                document.getElementById('tabla-ordenes').style.display = 'none';
                if (ultimoContexto === 'todos') {
                    emptyMsg.textContent = 'No hay pedidos. Los pedidos se crean desde el carrito en Ventas.';
                } else {
                    emptyMsg.textContent = 'No se encontraron pedidos para la búsqueda realizada.';
                }
                emptyMsg.style.display = 'block';
                return;
            }
            document.getElementById('tabla-ordenes').style.display = 'table';
            emptyMsg.style.display = 'none';
            let listaOrdenes = ordenes;
            ordenes.forEach((o, idx) => {
                const tr = document.createElement('tr');
const esPagado = (o.estado || '').toUpperCase() === 'PAGADO' || (o.estado || '').toUpperCase() === 'APROBADO';
                const estadoClase = esPagado ? 'estado-pagado' : 'estado-pendiente';
                const estadoTexto = esPagado ? 'Pagado' : (o.estado || 'Pendiente');
                tr.innerHTML = `
                    <td><strong>${o.numeroFormateado || ('00' + o.numero).slice(-3)}</strong></td>
                    <td>${escapeHtml(o.clienteNombre || '—')}</td>
                    <td>${formatFecha(o.fecha)}</td>
                    <td>${formatTotal(o.total)}</td>
<td><span class="estado-badge ${estadoClase}">${escapeHtml(estadoTexto)}</span></td>
                    <td><button type="button" class="btn-ver-pedido" data-idx="${idx}">Ver pedido</button></td>
                `;
                tbody.appendChild(tr);
            });
            tbody.querySelectorAll('.btn-ver-pedido').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.getAttribute('data-idx'), 10);
                    if (!isNaN(idx) && listaOrdenes[idx]) abrirModalPedido(listaOrdenes[idx]);
                });
            });
        }

        function abrirModalPedido(orden) {
            const num = orden.numeroFormateado || ('00' + orden.numero).slice(-3);
            document.getElementById('pedido-modal-numero').textContent = 'Nº ' + num;
            let fechaStr = '—';
            let entregaStr = '—';
            try {
                const d = new Date(orden.fecha);
                fechaStr = d.toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
                const entrega = new Date(d);
                entrega.setDate(entrega.getDate() + 15);
                entregaStr = entrega.toLocaleDateString('es-CO', { dateStyle: 'medium' });
            } catch (_) {}
            document.getElementById('pedido-modal-fechas').innerHTML = '<strong>Fecha:</strong> ' + fechaStr + '<br><strong>Fecha de entrega:</strong> ' + entregaStr;
            document.getElementById('pedido-modal-cliente').innerHTML = `
                <p><strong>Nombre:</strong> ${escapeHtml(orden.clienteNombre || '—')}</p>
                <p><strong>Cédula:</strong> ${escapeHtml(orden.clienteCedula || '—')}</p>
                <p><strong>Correo:</strong> ${escapeHtml(orden.clienteCorreo || '—')}</p>
                <p><strong>Teléfono:</strong> ${escapeHtml(orden.clienteTelefono || '—')}</p>
                <p><strong>Dirección:</strong> ${escapeHtml(orden.clienteDireccion || '—')}</p>
            `;
            let items = [];
            try {
                items = typeof orden.itemsJson === 'string' ? JSON.parse(orden.itemsJson) : (orden.itemsJson || []);
            } catch (_) {}
            const totalNum = orden.total != null ? (typeof orden.total === 'number' ? orden.total : Number(orden.total)) : 0;
            const totalStr = new Intl.NumberFormat('es-CO').format(totalNum);
            let tablaHtml = '<table class="tabla-productos"><thead><tr><th>Prendas de vestir</th><th>Talla</th><th>Cant.</th><th>P.Unit</th><th>Subtotal</th></tr></thead><tbody>';
            items.forEach(i => {
                const nombre = escapeHtml(i.nombre || '—');
                const talla = escapeHtml(i.talla || '—');
                const cant = i.cantidad != null ? i.cantidad : '—';
                const pUnit = i.precioUnit != null ? new Intl.NumberFormat('es-CO').format(i.precioUnit) : '—';
                const subtotal = i.subtotal != null ? new Intl.NumberFormat('es-CO').format(i.subtotal) : '—';
                tablaHtml += '<tr><td>' + nombre + '</td><td>' + talla + '</td><td>' + cant + '</td><td>' + pUnit + '</td><td>' + subtotal + '</td></tr>';
            });
            tablaHtml += '</tbody></table>';
            document.getElementById('pedido-modal-productos').innerHTML = tablaHtml;
            document.getElementById('pedido-modal-total').textContent = 'Total: ' + totalStr + ' COP';
            document.getElementById('pedido-modal-vendedor').textContent = 'Vendedor: ' + (orden.vendedorNombre || '—');
            const overlay = document.getElementById('pedido-modal-overlay');
            overlay.classList.remove('hidden');
            overlay.setAttribute('aria-hidden', 'false');
        }

        document.getElementById('pedido-modal-cerrar').addEventListener('click', () => {
            document.getElementById('pedido-modal-overlay').classList.add('hidden');
            document.getElementById('pedido-modal-overlay').setAttribute('aria-hidden', 'true');
        });
        document.getElementById('pedido-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'pedido-modal-overlay') {
                document.getElementById('pedido-modal-overlay').classList.add('hidden');
                document.getElementById('pedido-modal-overlay').setAttribute('aria-hidden', 'true');
            }
        });

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function verRecibo(id) {
            try {
                const res = await fetch('/api/recibos/' + id, { credentials: 'include' });
                if (!res.ok) throw new Error('No se pudo cargar el pedido');
                const r = await res.json();
                const num = r.numeroFormateado || ('00' + r.numero).slice(-3);
                const fechaStr = formatFecha(r.fecha);
                const fechaEntrega = (() => {
                    try {
                        const d = new Date(r.fecha);
                        d.setDate(d.getDate() + 15);
                        return d.toLocaleDateString('es-CO');
                    } catch (_) { return '—'; }
                })();
                let itemsHtml = '';
                try {
                    const items = JSON.parse(r.itemsJson || '[]');
                    items.forEach(i => {
                        const nombre = escapeHtml(i.nombre || i.name || '—');
                        const talla = escapeHtml(i.talla || i.size || '—');
                        const cant = i.cantidad ?? i.quantity ?? 0;
                        const pUnit = (i.precioUnit ?? i.unitPrice ?? 0);
                        const subtotal = (i.subtotal ?? (pUnit * cant));
                        itemsHtml += `<tr><td>${nombre}</td><td>${talla}</td><td>${cant}</td><td>${formatTotal(pUnit)}</td><td>${formatTotal(subtotal)}</td></tr>`;
                    });
                } catch (_) { itemsHtml = '<tr><td colspan="5">—</td></tr>'; }
                const body = document.getElementById('modal-recibo-body');
                body.innerHTML = `
                    <p style="text-align:center;color:#666;font-size:12px;margin:0;">Orden de compra</p>
                    <p style="text-align:center;font-size:18px;font-weight:bold;margin:0 0 16px;">Nº ${num}</p>
                    <p style="font-size:12px;color:#555;"><strong>Fecha:</strong> ${fechaStr}</p>
                    <p style="font-size:12px;color:#555;margin-bottom:16px;"><strong>Fecha de entrega:</strong> ${fechaEntrega}</p>
                    <h3>Cliente</h3>
                    <p>Nombre: ${escapeHtml(r.clienteNombre || '—')}</p>
                    <p>Cédula: ${escapeHtml(r.clienteCedula || '—')}</p>
                    <p>Correo: ${escapeHtml(r.clienteCorreo || '—')}</p>
                    <p>Teléfono: ${escapeHtml(r.clienteTelefono || '—')}</p>
                    <p>Dirección: ${escapeHtml(r.clienteDireccion || '—')}</p>
                    <h3>Productos</h3>
                    <table class="modal-recibo-table">
                        <thead><tr><th>Prendas</th><th>Talla</th><th>Cant.</th><th>P.Unit</th><th>Subtotal</th></tr></thead>
                        <tbody>${itemsHtml}</tbody>
                    </table>
                    <div class="modal-recibo-total-wrap">
                        <div class="modal-recibo-total">Total: ${formatTotal(r.total)}</div>
                        <div class="modal-recibo-vendedor">Vendedor: ${escapeHtml(r.vendedorNombre || '—')}</div>
                    </div>
                `;
                document.getElementById('modal-recibo-overlay').classList.remove('hidden');
            } catch (err) {
                Toast.error(err.message || 'Error al cargar el recibo');
            }
        }

        document.getElementById('modal-recibo-cerrar').addEventListener('click', () => {
            document.getElementById('modal-recibo-overlay').classList.add('hidden');
        });
        document.getElementById('modal-recibo-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-recibo-overlay') e.target.classList.add('hidden');
        });

        function refrescarOrdenes() {
            if (ultimoContexto === 'todos') cargarOrdenes();
            else if (ultimoContexto === 'numero') cargarOrdenes({ numero: document.getElementById('buscar-numero').value.trim() });
            else if (ultimoContexto === 'cedula') cargarOrdenes({ cedula: document.getElementById('buscar-cedula').value.trim() });
            else if (ultimoContexto === 'fecha') cargarOrdenes({ fecha: document.getElementById('buscar-fecha').value });
            else if (ultimoContexto === 'mes') cargarOrdenes({ mes: document.getElementById('buscar-mes').value });
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') refrescarOrdenes();
        });
        setInterval(() => {
            if (document.visibilityState === 'visible') refrescarOrdenes();
        }, 25000);

        cargarOrdenes();
    </script>
</body>
</html>
