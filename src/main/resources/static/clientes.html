<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar clientes - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .crud-section { max-width: 900px; margin: 0 auto; padding: 24px; }
        .crud-toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .crud-toolbar input, .crud-toolbar select { padding: 10px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 14px; }
        .crud-toolbar .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary-crud { background: #f5a623; color: #1a1a1a; }
        .btn-primary-crud:hover { background: #e09520; }
        .btn-secondary { background: #333; color: white; border: 1px solid #555; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .crud-table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .crud-table th, .crud-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #333; }
        .crud-table th { background: #222; color: #f5a623; font-weight: bold; }
        .crud-table tr:hover { background: #252525; }
        .crud-table .actions { display: flex; gap: 8px; }
        .crud-table .actions button { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.hidden { display: none; }
        .modal-box { background: #1a1a1a; border-radius: 12px; padding: 24px; min-width: 400px; max-width: 500px; border: 1px solid #333; }
        .modal-box h3 { margin-bottom: 20px; color: #f5a623; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 13px; }
        .form-group input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        .modal-actions { display: flex; gap: 12px; justify-content: space-between; margin-top: 24px; }
        .modal-actions .btn { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; font-size: 14px; }
        .empty-msg { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body class="panel-admin-body">

    <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-sidebar-header">
            <a href="/" class="admin-logo">
                <span class="admin-logo-icon">U</span>
                <span class="admin-logo-text">UNISOF</span>
            </a>
        </div>
        <nav class="admin-nav">
            <a href="/ventas.html" class="admin-nav-item" data-section="ventas">
                <span class="admin-nav-icon">💼</span>
                <span class="admin-nav-item-label">
                    <span class="admin-nav-text" data-i18n-key="nav.sales">Ventas</span>
                </span>
            </a>
            <a href="/clientes.html" class="admin-nav-item active" data-section="clientes">
                <span class="admin-nav-icon">👥</span>
                <span class="admin-nav-item-label">
                    <span class="admin-nav-text" data-i18n-key="nav.clients">Clientes</span>
                </span>
            </a>
            <a href="/ordenes.html" class="admin-nav-item" data-section="ordenes">
                <span class="admin-nav-icon">📋</span>
                <span class="admin-nav-item-label">
                    <span class="admin-nav-text" data-i18n-key="nav.requests">Pedidos</span>
                </span>
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <div class="admin-user-info" id="admin-sidebar-user">
                <span class="admin-user-name" id="user-name">—</span>
                <span class="admin-user-rol" id="user-rol">VENDEDOR</span>
            </div>
            <button type="button" class="admin-btn-logout" id="btn-logout" data-i18n-key="common.logout">Cerrar sesión</button>
        </div>
    </aside>

        <div class="admin-main-wrap">
            <header class="admin-topbar">
                <h1 class="admin-topbar-title" data-i18n-key="title.clients">Clientes</h1>
            </header>

        <main class="admin-dashboard">
        <div class="panel-main">
        <h1 class="panel-title" data-i18n-key="title.clients">Consultar clientes</h1>
        <div class="crud-section">
            <div class="crud-toolbar">
                <input type="text" id="buscar-cedula" data-i18n-placeholder="clients.search" placeholder="Buscar por cédula" style="width: 200px;">
                <button type="button" class="btn btn-secondary" id="btn-buscar-cedula" data-i18n-key="clients.searchBtn">Buscar</button>
                <button type="button" class="btn btn-primary-crud" id="btn-crear" data-i18n-key="clients.create">Crear cliente</button>
                <button type="button" class="btn btn-secondary" id="btn-listar-todos" data-i18n-key="clients.listAll">Listar todos</button>
                <button type="button" class="btn btn-secondary" id="btn-limpiar-toolbar">Limpiar campos</button>
            </div>
            <div id="tabla-container">
                <table class="crud-table" id="tabla-clientes">
                    <thead>
                        <tr>
                            <th data-i18n-key="clients.name">Nombre</th>
                            <th data-i18n-key="clients.cedula">Cédula</th>
                            <th data-i18n-key="clients.email">Correo</th>
                            <th data-i18n-key="clients.phone">Teléfono</th>
                            <th data-i18n-key="clients.actions">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                    </tbody>
                </table>
                <p class="empty-msg" id="empty-msg" style="display:none;" data-i18n-key="clients.empty">No hay clientes. Haz clic en "Crear cliente" para agregar uno.</p>
            </div>
            <div class="clientes-actions-bar">
                <span id="clientes-seleccion-info" data-i18n-key="clients.noSelection">Ningún cliente seleccionado.</span>
            </div>
        </div>
        </div>
        </main>
    </div>

    <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Abrir menú">☰</button>

    <!-- Modal Crear/Editar -->
    <div class="modal-overlay hidden" id="modal-cliente">
        <div class="modal-box">
            <h3 id="modal-titulo" data-i18n-key="clients.modalCreate">Crear cliente</h3>
            <form id="form-cliente">
                <input type="hidden" id="form-id">
                <div class="form-group">
                    <label for="form-nombre" data-i18n-key="clients.fullName">Nombre completo *</label>
                    <input type="text" id="form-nombre" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="form-cedula" data-i18n-key="clients.cedulaLabel">Cédula *</label>
                    <input type="text" id="form-cedula" required placeholder="Ej: 123456789" pattern="[0-9\s\-\.]+">
                </div>
                <div class="form-group">
                    <label for="form-correo" data-i18n-key="clients.emailLabel">Correo electrónico *</label>
                    <input type="email" id="form-correo" required placeholder="cliente@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="form-telefono" data-i18n-key="clients.phoneLabel">Teléfono</label>
                    <input type="tel" id="form-telefono" placeholder="+57 300 123 4567">
                </div>
                <div class="form-group">
                    <label for="form-direccion" data-i18n-key="clients.address">Dirección</label>
                    <input type="text" id="form-direccion" placeholder="Calle, ciudad, país">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cerrar-modal" data-i18n-key="clients.cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary-crud" data-i18n-key="clients.save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/accessibility.js"></script>
    <script src="/js/unisof-brand-info.js" defer></script>
    <link rel="stylesheet" href="/css/chat.css">
    <script src="/js/chat.js" defer></script>
    <script>
        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) { window.location.href = '/login.html'; return; }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (rol !== 'VENDEDOR') { window.location.href = '/'; return; }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent = result.usuario?.rol || 'VENDEDOR';
        })();

        document.getElementById('btn-logout').addEventListener('click', async () => {
            const confirmar = window.confirm('¿Desea cerrar sesión?');
            if (!confirmar) return;
            await authApi.logout();
            window.location.href = '/';
        });

        // Sidebar móvil igual que en ventas/panel-admin
        const sidebar = document.getElementById('admin-sidebar');
        const toggle = document.getElementById('admin-sidebar-toggle');
        if (toggle && sidebar) {
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                toggle.setAttribute('aria-label', sidebar.classList.contains('open') ? 'Cerrar menú' : 'Abrir menú');
            });
        }

        // Resaltar opción activa del menú lateral
        const currentPath = window.location.pathname;
        document.querySelectorAll('.admin-nav-item[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href !== '#' && !href.startsWith('#') && currentPath.indexOf(href) !== -1) {
                link.classList.add('active');
            } else if (link.getAttribute('href') === '/clientes.html' && currentPath === '/clientes.html') {
                link.classList.add('active');
            } else if (!link.classList.contains('admin-nav-item--disabled')) {
                link.classList.remove('active');
            }
        });

        const modal = document.getElementById('modal-cliente');
        const form = document.getElementById('form-cliente');
        const infoSeleccion = document.getElementById('clientes-seleccion-info');
        const inputBuscarCedula = document.getElementById('buscar-cedula');
        let clienteSeleccionadoId = null;

        function limpiarSeleccion() {
            clienteSeleccionadoId = null;
            const filas = document.querySelectorAll('#tabla-body tr');
            filas.forEach(fila => fila.classList.remove('usuarios-row-selected'));
            if (infoSeleccion) {
                infoSeleccion.textContent = 'Ningún cliente seleccionado.';
            }
        }

        async function listarTodos() {
            try {
                const res = await fetch('/api/clientes', { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al listar');
                renderTabla(Array.isArray(data) ? data : [data]);
            } catch (err) {
                Toast.error(err.message || 'Error al cargar clientes');
                renderTabla([]);
            }
        }

        document.getElementById('btn-listar-todos').addEventListener('click', listarTodos);

        document.getElementById('btn-limpiar-toolbar').addEventListener('click', () => {
            if (inputBuscarCedula) inputBuscarCedula.value = '';
            limpiarSeleccion();
            renderTabla([]);
        });



        document.getElementById('btn-buscar-cedula').addEventListener('click', async () => {
            const cedula = document.getElementById('buscar-cedula').value.trim();
            if (!cedula) { Toast.error('Ingresa una cédula'); return; }
            try {
                const res = await fetch('/api/clientes/buscar?cedula=' + encodeURIComponent(cedula), { credentials: 'include' });
                const data = await res.json();
                if (data.encontrado && data.cliente) {
                    renderTabla([data.cliente]);
                } else {
                    Toast.info('Cliente no encontrado');
                    renderTabla([]);
                }
            } catch (err) {
                Toast.error('Error al buscar');
                renderTabla([]);
            }
        });

        function renderTabla(clientes) {
            limpiarSeleccion();
            const tbody = document.getElementById('tabla-body');
            const emptyMsg = document.getElementById('empty-msg');
            tbody.innerHTML = '';
            if (clientes.length === 0) {
                document.getElementById('tabla-clientes').style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }
            document.getElementById('tabla-clientes').style.display = 'table';
            emptyMsg.style.display = 'none';
            clientes.forEach(c => {
                const tr = document.createElement('tr');
                tr.dataset.id = c.id;
                tr.innerHTML = `
                    <td>${escapeHtml(c.nombre)}</td>
                    <td>${escapeHtml(c.cedula)}</td>
                    <td>${escapeHtml(c.correo)}</td>
                    <td>${escapeHtml(c.telefono || '—')}</td>
                    <td>
                        <div class="actions">
                            <button type="button" class="btn btn-secondary btn-editar" data-id="${c.id}" data-i18n-key="clients.edit">Editar</button>
                        </div>
                    </td>
                `;
                tr.addEventListener('click', (event) => {
                    // Evitar que el click en el botón "Editar" dispare la selección de fila
                    if (event.target.closest('button')) return;
                    seleccionarFilaCliente(tr, c);
                });
                tbody.appendChild(tr);
            });
            tbody.querySelectorAll('.btn-editar').forEach(btn => {
                btn.addEventListener('click', () => abrirEditar(btn.dataset.id));
            });
        }

        function seleccionarFilaCliente(tr, cliente) {
            const tbody = document.getElementById('tabla-body');
            if (!tbody) return;

            const yaSeleccionada = tr.classList.contains('usuarios-row-selected');
            limpiarSeleccion();

            if (!yaSeleccionada) {
                tr.classList.add('usuarios-row-selected');
                clienteSeleccionadoId = cliente.id;
                if (infoSeleccion) {
                    const nombre = cliente.nombre || '—';
                    const cedula = cliente.cedula || '—';
                    infoSeleccion.textContent = `Seleccionado: ${nombre} (${cedula})`;
                }
            }
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        document.getElementById('btn-crear').addEventListener('click', () => {
            document.getElementById('modal-titulo').textContent = (typeof __a11yTranslate === 'function' ? __a11yTranslate('clients.modalCreate') : 'Crear cliente');
            document.getElementById('form-id').value = '';
            form.reset();
            modal.classList.remove('hidden');
        });

        document.getElementById('btn-cerrar-modal').addEventListener('click', () => modal.classList.add('hidden'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

        async function abrirEditar(id) {
            try {
                const res = await fetch('/api/clientes/' + id, { credentials: 'include' });
                if (!res.ok) throw new Error('Cliente no encontrado');
                const c = await res.json();
                document.getElementById('modal-titulo').textContent = (typeof __a11yTranslate === 'function' ? __a11yTranslate('clients.modalEdit') : 'Editar cliente');
                document.getElementById('form-id').value = c.id;
                document.getElementById('form-nombre').value = c.nombre;
                document.getElementById('form-cedula').value = c.cedula;
                document.getElementById('form-correo').value = c.correo;
                document.getElementById('form-telefono').value = c.telefono || '';
                document.getElementById('form-direccion').value = c.direccion || '';
                modal.classList.remove('hidden');
            } catch (err) {
                Toast.error(err.message);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const body = {
                nombre: document.getElementById('form-nombre').value.trim(),
                cedula: document.getElementById('form-cedula').value.trim(),
                correo: document.getElementById('form-correo').value.trim(),
                telefono: document.getElementById('form-telefono').value.trim(),
                direccion: document.getElementById('form-direccion').value.trim()
            };
            try {
                const url = id ? '/api/clientes/' + id : '/api/clientes';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al guardar');
                Toast.success(id ? 'Cliente actualizado' : 'Cliente creado');
                modal.classList.add('hidden');
                listarTodos();
            } catch (err) {
                Toast.error(err.message);
            }
        });

        listarTodos();
    </script>
</body>
</html>
