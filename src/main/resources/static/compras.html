<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compras - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="welcome-toast" id="welcome-toast">¡Bienvenido a UNISOF!</div>

    <header class="navbar">
        <a href="/" class="link-atras">← Atrás</a>
        <a href="/" class="logo">
            <span class="logo-icon">U</span>
            <span class="logo-text">UNISOF</span>
        </a>
        <div class="nav-user-info" id="nav-user-info">
            <span class="user-name" id="user-name">—</span>
            <span class="user-rol" id="user-rol">JEFE DE COMPRAS</span>
        </div>
        <button type="button" class="btn-logout btn-logout-nav" id="btn-logout">Cerrar Sesión</button>
    </header>

    <main class="panel-main">
        <h1 class="panel-title">Compras y producción</h1>
        <p class="panel-placeholder">Interfaz de compras de insumos en desarrollo. Se implementará junto con el backend correspondiente.</p>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) {
                window.location.href = '/login.html';
                return;
            }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (rol !== 'JEFE DE COMPRAS') {
                window.location.href = '/';
                return;
            }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent = result.usuario?.rol || 'JEFE DE COMPRAS';

            const welcomeMsg = document.getElementById('welcome-toast');
            if (new URLSearchParams(window.location.search).get('welcome') === '1') {
                welcomeMsg?.classList.add('visible');
                window.history.replaceState({}, '', '/compras.html');
                setTimeout(() => welcomeMsg?.classList.remove('visible'), 3000);
            }
        })();

        document.getElementById('btn-logout').addEventListener('click', async () => {
            const confirmar = window.confirm('¿Desea cerrar sesión?');
            if (!confirmar) return;
            await authApi.logout();
            window.location.href = '/';
        });
    </script>
    <link rel="stylesheet" href="/css/chat.css">
    <script src="/js/chat.js" defer></script>
</body>
</html>
