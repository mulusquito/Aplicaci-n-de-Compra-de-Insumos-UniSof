<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <a href="/login.html" class="link-atras link-atras-top">← Atrás</a>
        <a href="/" class="logo auth-logo">
            <span class="logo-icon">U</span>
            <span class="logo-text">UNISOF</span>
        </a>

        <h1 class="auth-title">Recuperar contraseña</h1>
        <p class="auth-subtitle">Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>

        <form id="form-recuperar" class="auth-form">
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
            </div>
            <div id="error-msg" class="error-msg" style="display:none"></div>
            <div id="success-msg" class="success-msg" style="display:none"></div>
            <button type="submit" class="btn-primary btn-block">Enviar instrucciones</button>
        </form>

        <p class="auth-subtitle" style="margin-top:16px; font-size:13px;">
            (Funcionalidad en desarrollo — el backend se implementará próximamente)
        </p>

        <p class="auth-footer"><a href="/login.html">← Volver al login</a></p>
    </div>

    <script src="/js/toast.js"></script>
    <script>
        document.getElementById('form-recuperar').addEventListener('submit', (e) => {
            e.preventDefault();
            Toast.info('Próximamente: se enviarán instrucciones a tu correo.');
            document.getElementById('success-msg').textContent = 'Próximamente: se enviarán instrucciones a tu correo.';
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
        });
    </script>
</body>
</html>
