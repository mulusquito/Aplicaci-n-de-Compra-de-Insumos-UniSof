<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/sign-language-bubble.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <a href="/" class="logo auth-logo">
            <span class="logo-icon">U</span>
            <span class="logo-text">UNISOF</span>
        </a>

        <h1 class="auth-title" data-i18n-key="auth.title"
            data-sign-src="/videos/lsv/0417(6).mp4"
            data-sign-position="element-right"
            data-sign-halign-with="#contrasena"
            data-sign-label="Iniciar sesión">Iniciar Sesión</h1>
        <p class="auth-subtitle" data-i18n-key="auth.subtitle">Ingresa tus credenciales para acceder</p>

        <form id="form-login" class="auth-form">
            <div class="form-group">
                <label for="usuario" data-i18n-key="auth.user">Usuario</label>
                <input type="text" id="usuario" name="usuario" required data-i18n-placeholder="auth.userPlaceholder" placeholder="Ej: admin"
                    data-sign-src="/videos/lsv/0409(12).mp4"
                    data-sign-position="element-right"
                    data-sign-label="Campo usuario — inicio de sesión">
            </div>
            <div class="form-group">
                <label for="contrasena" data-i18n-key="auth.password">Contraseña</label>
                <div class="input-password-wrapper">
                    <input type="password" id="contrasena" name="contrasena" required data-i18n-placeholder="auth.passPlaceholder" placeholder="Ej: tu contraseña"
                        data-sign-src="/videos/lsv/0409(7).mp4"
                        data-sign-position="element-right"
                        data-sign-label="Campo contraseña — inicio de sesión">
                    <button type="button" class="btn-toggle-password" id="btn-toggle-password" aria-label="Mostrar u ocultar contraseña"></button>
                </div>
            </div>
            <div id="error-msg" class="error-msg" style="display:none"></div>
            <p class="auth-forgot"><a href="/recuperar-contrasena.html" data-i18n-key="auth.forgot"
                data-sign-src="/videos/lsv/0409(11).mp4"
                data-sign-position="element-right"
                data-sign-halign-with="#contrasena"
                data-sign-label="Recuperar contraseña">¿Olvidaste la contraseña?</a></p>
            <div class="auth-submit-wrap">
                <button type="submit" class="btn-primary btn-block" id="btn-login-submit" data-i18n-key="auth.submit"
                    data-sign-src="/videos/lsv/0417(6).mp4"
                    data-sign-position="element-right"
                    data-sign-halign-with="#contrasena"
                    data-sign-label="Iniciar sesión">Iniciar Sesión</button>
                <div class="auth-loader" id="auth-loader" aria-hidden="true">
                    <span class="auth-loader-spinner"></span>
                    <span class="auth-loader-text">Verificando…</span>
                </div>
            </div>
        </form>

        <p class="auth-footer"><a href="/" data-i18n-key="auth.back">← Volver al inicio</a></p>
    </div>

    <style>
        .auth-submit-wrap { position: relative; margin-top: 4px; }
        .auth-loader {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 0;
            font-size: 13px;
            color: #999;
        }
        .auth-loader.is-active { display: flex; }
        .auth-loader-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(245, 166, 35, 0.25);
            border-top-color: #f5a623;
            border-radius: 50%;
            animation: auth-spin 0.7s linear infinite;
        }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
        .auth-submit-wrap.is-loading .btn-primary { opacity: 0.6; pointer-events: none; }
    </style>
    <script src="/js/toast.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/accessibility.js"></script>
    <script src="/js/sign-language-bubble.js"></script>
    <script src="/js/unisof-brand-info.js" defer></script>
    <script>
        // Mostrar/ocultar contraseña con un solo ojito
        (function() {
            const input = document.getElementById('contrasena');
            const btn = document.getElementById('btn-toggle-password');
            if (!input || !btn) return;

            btn.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
            });
        })();

        (function() {
            const form = document.getElementById('form-login');
            const submitBtn = document.getElementById('btn-login-submit');
            const loader = document.getElementById('auth-loader');
            const wrap = document.querySelector('.auth-submit-wrap');
            const errorEl = document.getElementById('error-msg');

            function setLoading(loading) {
                if (loading) {
                    wrap.classList.add('is-loading');
                    loader.classList.add('is-active');
                    submitBtn.disabled = true;
                } else {
                    wrap.classList.remove('is-loading');
                    loader.classList.remove('is-active');
                    submitBtn.disabled = false;
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const usuario = document.getElementById('usuario').value.trim();
                const contrasena = document.getElementById('contrasena').value;

                errorEl.style.display = 'none';
                setLoading(true);

                let result;
                try {
                    result = await authApi.login(usuario, contrasena);
                } catch (err) {
                    setLoading(false);
                    Toast.error('Error de conexión. Verifica tu red.');
                    errorEl.textContent = 'Error de conexión con el servidor';
                    errorEl.style.display = 'block';
                    return;
                }

                if (result.ok) {
                    if (result.data.requiereVerificacionDosPasos) {
                        loader.querySelector('.auth-loader-text').textContent = 'Revisa tu correo…';
                        Toast.success('Token enviado a tu correo. Revisa tu bandeja.');
                        sessionStorage.setItem('loginUsuario', usuario);
                        setTimeout(() => { window.location.href = '/verificar-token.html'; }, 1500);
                    } else {
                        Toast.success('Inicio de sesión exitoso');
                        setTimeout(() => { window.location.href = '/'; }, 800);
                    }
                } else {
                    setLoading(false);
                    Toast.error(result.mensaje || 'Credenciales inválidas');
                    errorEl.textContent = result.mensaje || 'Credenciales inválidas';
                    errorEl.style.display = 'block';
                }
            });
        })();
    </script>
    <link rel="stylesheet" href="/css/chat.css">
    <script src="/js/chat.js" defer></script>
</body>
</html>
