<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - UNISOF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <a href="/" class="logo auth-logo">
            <span class="logo-icon">U</span>
            <span class="logo-text">UNISOF</span>
        </a>

        <h1 class="auth-title">Iniciar Sesión</h1>
        <p class="auth-subtitle">Ingresa tus credenciales para acceder</p>

        <form id="form-login" class="auth-form">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ej: admin">
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required placeholder="Ej: tu contraseña">
            </div>
            <div id="error-msg" class="error-msg" style="display:none"></div>
            <p class="auth-forgot"><a href="/recuperar-contrasena.html">¿Olvidaste la contraseña?</a></p>
            <button type="submit" class="btn-primary btn-block">Iniciar Sesión</button>
        </form>

        <p class="auth-footer"><a href="/">← Volver al inicio</a></p>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const errorEl = document.getElementById('error-msg');

            errorEl.style.display = 'none';
            let result;
            try {
                result = await authApi.login(usuario, contrasena);
            } catch (err) {
                Toast.error('Error de conexión. Verifica tu red.');
                errorEl.textContent = 'Error de conexión con el servidor';
                errorEl.style.display = 'block';
                return;
            }

            if (result.ok) {
                if (result.data.requiereVerificacionDosPasos) {
                    Toast.success('Token enviado a tu correo. Revisa tu bandeja.');
                    sessionStorage.setItem('loginUsuario', usuario);
                    setTimeout(() => { window.location.href = '/verificar-token.html'; }, 1500);
                } else {
                    Toast.success('Inicio de sesión exitoso');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                }
            } else {
                Toast.error(result.mensaje || 'Credenciales inválidas');
                errorEl.textContent = result.mensaje || 'Credenciales inválidas';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
