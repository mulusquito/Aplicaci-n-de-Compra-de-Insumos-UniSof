<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Facturas a Proveedores — Jefe de Compras | UNISOF">
    <title>Facturas a Proveedores | UNISOF</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- jsPDF + autoTable para generación de PDF cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        .fp-section { padding: 24px; }
        .fp-page-title { font-size: 20px; font-weight: 700; color: #f5a623; margin: 0 0 24px; display: flex; align-items: center; gap: 10px; }
        .fp-empty { text-align: center; padding: 56px 24px; color: #666; font-size: 14px; }
        .fp-empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }

        /* ── Grid de proveedores (igual que fichas-tecnicas) ── */
        .fp-proveedores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .fp-prov-card {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
            user-select: none;
        }
        .fp-prov-card:hover { border-color: #555; background: #222; }
        .fp-prov-card.active {
            border-color: #f5a623;
            background: #222;
            box-shadow: 0 0 0 2px rgba(245,166,35,0.2);
        }
        .fp-prov-nombre { font-size: 14px; font-weight: 700; color: #eee; margin: 0 0 4px; }
        .fp-prov-nit    { font-size: 11px; color: #888; margin: 0 0 8px; }
        .fp-prov-badge  { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 12px; background: #2a2a2a; color: #f5a623; border: 1px solid #3a3a3a; }

        /* ── Panel de facturas del proveedor seleccionado ── */
        .fp-facturas-panel { display: none; }
        .fp-facturas-panel.visible { display: block; }
        .fp-panel-title { font-size: 15px; font-weight: 700; color: #f5a623; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }

        /* ── Tarjetas de facturas ── */
        .fp-factura-card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .fp-factura-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.15s;
            flex-wrap: wrap;
            gap: 8px;
        }
        .fp-factura-header:hover { background: #1e1e1e; }
        .fp-factura-num  { font-size: 14px; font-weight: 700; color: #f5a623; }
        .fp-factura-fecha { font-size: 12px; color: #888; }
        .fp-factura-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .badge-borrador { background: #2a2a2a; color: #aaa; border: 1px solid #444; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
        .badge-enviada  { background: rgba(39,174,96,0.15); color: #27ae60; border: 1px solid #27ae60; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
        .fp-toggle-icon { font-size: 16px; color: #f5a623; transition: transform 0.3s ease; flex-shrink: 0; }
        .fp-toggle-icon.abierto { transform: rotate(180deg); }

        .fp-factura-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
            padding: 0 18px;
            border-top: 0 solid #2a2a2a;
        }
        .fp-factura-body.visible {
            max-height: 900px;
            padding: 16px 18px;
            border-top: 1px solid #2a2a2a;
        }

        /* ── Tabla de insumos en la factura ── */
        .fp-ins-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #2a2a2a; margin-bottom: 16px; }
        .fp-ins-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #111; }
        .fp-ins-table th { background: #1e1e1e; color: #aaa; font-weight: 700; padding: 9px 12px; text-align: left; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
        .fp-ins-table td { padding: 8px 12px; border-bottom: 1px solid #1e1e1e; color: #ddd; vertical-align: middle; }
        .fp-ins-table tbody tr:last-child td { border-bottom: none; }
        .fp-ins-table tbody tr:hover { background: #181818; }

        /* Ajuste de cantidad +/- */
        .cant-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
        .cant-val  { min-width: 60px; text-align: center; font-weight: 700; color: #f5a623; font-variant-numeric: tabular-nums; }
        .btn-cant  { background: #2a2a2a; border: 1px solid #444; color: #ddd; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background 0.1s; }
        .btn-cant:hover { background: #3a3a3a; color: #fff; }
        .btn-cant:disabled { opacity: 0.4; cursor: not-allowed; }
        .cant-min-label { font-size: 11px; color: #666; white-space: nowrap; }

        /* Observaciones inline */
        .obs-input { background: #1a1a1a; border: 1px solid #333; color: #ccc; font-size: 12px; padding: 4px 8px; border-radius: 6px; width: 100%; min-width: 120px; }
        .obs-input:focus { outline: none; border-color: #f5a623; }

        /* Botones de acción de la factura */
        .fp-factura-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
        .fp-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.15s, opacity 0.15s; white-space: nowrap; }
        .fp-btn-pdf    { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
        .fp-btn-pdf:hover { background: #333; color: #fff; }
        .fp-btn-enviar { background: #f5a623; color: #1a1a1a; }
        .fp-btn-enviar:hover { background: #e09520; }
        .fp-btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; }
        .badge-ya-enviada { font-size: 12px; font-weight: 700; color: #27ae60; display: flex; align-items: center; gap: 6px; }

        /* Sección de firma en detalle */
        .fp-firma { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #333; font-size: 12px; color: #666; text-align: right; }

        @media (max-width: 600px) {
            .fp-proveedores-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

    <script>
        function esRolPanelCompras(rol) {
            const r = (rol || '').toUpperCase();
            return r === 'JEFE DE COMPRAS' || r === 'JEFE DE VENTAS' || r === 'ADMINISTRADOR';
        }
        function escHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }
        function formatFecha(iso) {
            if (!iso) return '—';
            try { return new Date(iso).toLocaleDateString('es-CO', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
            catch (_) { return iso; }
        }
        function formatNum(val) {
            if (val == null) return '0';
            const n = parseFloat(val);
            return isNaN(n) ? String(val) : n.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 4 });
        }

        // Modo administrador (solo lectura)
        let modoAdmin = false;

        // Datos en memoria: grupos por proveedor
        let grupos = [];
        // Cache de detalles de facturas
        const detalleCache = {};
        // Factura actualmente con body abierto
        let facturaAbiertoId = null;

        /* ══════════════════════════════════════════════════════════════════ */
        /* Cargar agrupación proveedor → facturas                           */
        /* ══════════════════════════════════════════════════════════════════ */
        async function cargarGrupos() {
            try {
                const res  = await fetch('/api/facturas-proveedor', { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al cargar facturas');
                grupos = Array.isArray(data) ? data : [];
                renderProveedores();
            } catch (err) {
                Toast.error(err.message || 'Error al cargar');
                document.getElementById('fp-proveedores-grid').innerHTML =
                    `<div class="fp-empty"><span class="fp-empty-icon">⚠️</span>Error al cargar datos.</div>`;
            }
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Renderizar tarjetas de proveedores                                */
        /* ══════════════════════════════════════════════════════════════════ */
        function renderProveedores() {
            const grid = document.getElementById('fp-proveedores-grid');
            if (grupos.length === 0) {
                grid.innerHTML = `<div class="fp-empty">
                    <span class="fp-empty-icon">📄</span>
                    No hay facturas generadas aún.<br>
                    Selecciona reportes en <strong>Órdenes de Compra</strong> y genera facturas.
                </div>`;
                return;
            }
            grid.innerHTML = grupos.map(g => {
                const n = (g.facturas || []).length;
                return `<div class="fp-prov-card" data-prov-id="${g.proveedorId}" tabindex="0" role="button"
                              aria-label="${escHtml(g.proveedorNombre)} — ${n} factura${n !== 1 ? 's' : ''}">
                    <div class="fp-prov-nombre">${escHtml(g.proveedorNombre)}</div>
                    <div class="fp-prov-nit">NIT: ${escHtml(g.proveedorNit || '—')}</div>
                    <span class="fp-prov-badge">${n} factura${n !== 1 ? 's' : ''}</span>
                </div>`;
            }).join('');

            grid.querySelectorAll('.fp-prov-card').forEach(card => {
                card.addEventListener('click', () => seleccionarProveedor(parseInt(card.dataset.provId)));
                card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') seleccionarProveedor(parseInt(card.dataset.provId)); });
            });
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Seleccionar proveedor y mostrar sus facturas                      */
        /* ══════════════════════════════════════════════════════════════════ */
        function seleccionarProveedor(provId) {
            // Marcar card activa
            document.querySelectorAll('.fp-prov-card').forEach(c => c.classList.toggle('active', parseInt(c.dataset.provId) === provId));

            const grupo = grupos.find(g => g.proveedorId === provId);
            if (!grupo) return;

            const panel = document.getElementById('fp-facturas-panel');
            panel.classList.add('visible');
            document.getElementById('fp-panel-title').textContent = `Facturas — ${grupo.proveedorNombre}`;
            facturaAbiertoId = null;
            renderFacturasList(grupo);
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Renderizar lista de facturas de un proveedor                      */
        /* ══════════════════════════════════════════════════════════════════ */
        function renderFacturasList(grupo) {
            const lista = document.getElementById('fp-facturas-lista');
            const facturas = grupo.facturas || [];
            if (facturas.length === 0) {
                lista.innerHTML = '<p style="color:#666;font-size:13px;">Sin facturas.</p>';
                return;
            }
            lista.innerHTML = facturas.map(f => `
                <div class="fp-factura-card" id="card-${f.id}">
                    <div class="fp-factura-header" data-factura-id="${f.id}">
                        <div>
                            <div class="fp-factura-num">${escHtml(f.numeroFactura)}</div>
                            <div class="fp-factura-fecha">${formatFecha(f.fechaGeneracion)}</div>
                        </div>
                        <div class="fp-factura-meta">
                            ${f.estado === 'ENVIADA'
                                ? `<span class="badge-enviada">✓ Enviada</span>`
                                : `<span class="badge-borrador">Borrador</span>`}
                            <span class="fp-toggle-icon" id="toggle-icon-${f.id}">▼</span>
                        </div>
                    </div>
                    <div class="fp-factura-body" id="body-${f.id}">
                        <div id="body-content-${f.id}">
                            <em style="color:#666;font-size:13px;">Cargando detalle…</em>
                        </div>
                    </div>
                </div>
            `).join('');

            lista.querySelectorAll('.fp-factura-header').forEach(header => {
                header.addEventListener('click', () => {
                    const fid = parseInt(header.dataset.facturaId);
                    toggleFactura(fid, facturas.find(f => f.id === fid));
                });
            });
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Toggle de factura                                                  */
        /* ══════════════════════════════════════════════════════════════════ */
        async function toggleFactura(fid, facturaData) {
            const body = document.getElementById(`body-${fid}`);
            const icon = document.getElementById(`toggle-icon-${fid}`);
            const estaAbierto = body.classList.contains('visible');

            // Cerrar la anterior si existe
            if (facturaAbiertoId !== null && facturaAbiertoId !== fid) {
                const prevBody = document.getElementById(`body-${facturaAbiertoId}`);
                const prevIcon = document.getElementById(`toggle-icon-${facturaAbiertoId}`);
                if (prevBody) prevBody.classList.remove('visible');
                if (prevIcon) prevIcon.classList.remove('abierto');
            }

            if (estaAbierto) {
                body.classList.remove('visible');
                icon.classList.remove('abierto');
                facturaAbiertoId = null;
            } else {
                body.classList.add('visible');
                icon.classList.add('abierto');
                facturaAbiertoId = fid;
                await cargarDetalleFactura(fid, facturaData);
            }
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Cargar y renderizar detalle de factura                            */
        /* ══════════════════════════════════════════════════════════════════ */
        async function cargarDetalleFactura(fid, facturaData) {
            if (detalleCache[fid]) {
                renderDetalleFactura(fid, detalleCache[fid], facturaData);
                return;
            }
            try {
                const res  = await fetch(`/api/facturas-proveedor/${fid}`, { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error');
                detalleCache[fid] = data;
                renderDetalleFactura(fid, data, facturaData);
            } catch (err) {
                document.getElementById(`body-content-${fid}`).innerHTML =
                    `<span style="color:#e05a5a;">Error al cargar: ${escHtml(err.message)}</span>`;
            }
        }

        function renderDetalleFactura(fid, data, facturaData) {
            const detalles = data.detalles || [];
            const enviada  = data.estado === 'ENVIADA';
            const soloLectura = enviada || modoAdmin;

            const filasHtml = detalles.map(d => `
                <tr>
                    <td>${escHtml(d.insumoNombre)}</td>
                    <td>${escHtml(d.unidadMedida || '—')}</td>
                    <td style="text-align:right;color:#aaa;">${formatNum(d.cantidadMinima)}</td>
                    <td>
                        ${modoAdmin
                            ? `<span class="cant-val" style="display:block;text-align:right;">${formatNum(d.cantidadAPedir)}</span>`
                            : `<div class="cant-wrap">
                                <button type="button" class="btn-cant btn-cant-menos"
                                    data-detalle-id="${d.id}" data-fid="${fid}"
                                    ${soloLectura ? 'disabled' : ''}
                                    title="Reducir cantidad">−</button>
                                <span class="cant-val" id="cant-val-${d.id}">${formatNum(d.cantidadAPedir)}</span>
                                <button type="button" class="btn-cant btn-cant-mas"
                                    data-detalle-id="${d.id}" data-fid="${fid}"
                                    ${soloLectura ? 'disabled' : ''}
                                    title="Aumentar cantidad">+</button>
                               </div>
                               <div class="cant-min-label" style="text-align:center;">mín: ${formatNum(d.cantidadMinima)}</div>`}
                    </td>
                    <td>
                        <input type="text" class="obs-input obs-field"
                            data-detalle-id="${d.id}"
                            value="${escHtml(d.observaciones || '')}"
                            placeholder="Observaciones…"
                            ${soloLectura ? 'disabled' : ''}>
                    </td>
                </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:#666;padding:16px;">Sin insumos.</td></tr>`;

            const accionesHtml = modoAdmin
                ? `<div class="fp-factura-actions">
                       <button type="button" class="fp-btn fp-btn-pdf" data-fid="${fid}">🖨 Generar PDF</button>
                       ${enviada
                           ? `<span class="badge-ya-enviada">✓ Enviada${data.enviadaAt ? ` <span style="font-weight:400;color:#666;">(${formatFecha(data.enviadaAt)})</span>` : ''}</span>`
                           : `<span class="badge-borrador">Borrador</span>`}
                   </div>`
                : enviada
                ? `<div class="fp-factura-actions">
                       <button type="button" class="fp-btn fp-btn-pdf" data-fid="${fid}">🖨 Generar PDF</button>
                       <span class="badge-ya-enviada">✓ Factura ya enviada al proveedor
                           ${data.enviadaAt ? `<span style="font-weight:400;color:#666;">(${formatFecha(data.enviadaAt)})</span>` : ''}
                       </span>
                   </div>`
                : `<div class="fp-factura-actions">
                       <button type="button" class="fp-btn fp-btn-pdf" data-fid="${fid}">🖨 Generar PDF</button>
                       <button type="button" class="fp-btn fp-btn-enviar" data-fid="${fid}" id="btn-enviar-${fid}">
                           ✉ Enviar por correo
                       </button>
                   </div>`;

            document.getElementById(`body-content-${fid}`).innerHTML = `
                <div class="fp-ins-table-wrap">
                    <table class="fp-ins-table">
                        <thead><tr>
                            <th>Insumo</th>
                            <th>Unidad</th>
                            <th style="text-align:right;">Cant. mínima</th>
                            <th style="text-align:right;">Cant. a pedir</th>
                            <th>Observaciones</th>
                        </tr></thead>
                        <tbody>${filasHtml}</tbody>
                    </table>
                </div>
                ${accionesHtml}
                <div class="fp-firma">
                    Proveedor: <strong style="color:#ddd;">${escHtml(data.proveedorNombre)}</strong>
                    &nbsp;|&nbsp; NIT: <strong style="color:#ddd;">${escHtml(data.proveedorNit || '—')}</strong>
                    &nbsp;|&nbsp; Correo: <strong style="color:#ddd;">${escHtml(data.proveedorCorreo || '—')}</strong>
                </div>`;

            // Guardar datos actuales en el cache con cantidades editables
            detalleCache[fid]._cantidades = {};
            detalles.forEach(d => {
                detalleCache[fid]._cantidades[d.id] = {
                    cantidadMinima: parseFloat(d.cantidadMinima) || 0,
                    cantidadAPedir: parseFloat(d.cantidadAPedir) || 0
                };
            });

            bindDetalleEvents(fid, data);
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Eventos de los botones +/- y enviar/PDF                           */
        /* ══════════════════════════════════════════════════════════════════ */
        function bindDetalleEvents(fid, data) {
            const container = document.getElementById(`body-content-${fid}`);
            if (!container) return;

            // Botones menos
            container.querySelectorAll('.btn-cant-menos').forEach(btn => {
                btn.addEventListener('click', () => ajustarCantidad(btn.dataset.detalleId, fid, -1));
            });
            // Botones más
            container.querySelectorAll('.btn-cant-mas').forEach(btn => {
                btn.addEventListener('click', () => ajustarCantidad(btn.dataset.detalleId, fid, +1));
            });
            // Botón PDF
            container.querySelectorAll('.fp-btn-pdf').forEach(btn => {
                btn.addEventListener('click', () => generarPDF(fid, data));
            });
            // Botón enviar
            const btnEnviar = document.getElementById(`btn-enviar-${fid}`);
            if (btnEnviar) {
                btnEnviar.addEventListener('click', () => enviarFactura(fid));
            }
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Ajustar cantidad +/-                                               */
        /* ══════════════════════════════════════════════════════════════════ */
        async function ajustarCantidad(detalleId, fid, delta) {
            const cache = detalleCache[fid]?._cantidades?.[detalleId];
            if (!cache) return;
            const nuevaCant = parseFloat((cache.cantidadAPedir + delta).toFixed(4));
            if (nuevaCant < cache.cantidadMinima) {
                Toast.error('No puede ser menor a la cantidad mínima requerida');
                return;
            }
            if (nuevaCant <= 0) return;

            try {
                const res  = await fetch(`/api/facturas-proveedor/detalle/${detalleId}/cantidad`, {
                    method:  'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ cantidadAPedir: nuevaCant })
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.mensaje || 'Error');

                cache.cantidadAPedir = parseFloat(d.cantidadAPedir) || nuevaCant;
                document.getElementById(`cant-val-${detalleId}`).textContent = formatNum(cache.cantidadAPedir);
                // Actualizar también el cache del detalle
                const det = detalleCache[fid]?.detalles?.find(x => x.id === parseInt(detalleId));
                if (det) det.cantidadAPedir = cache.cantidadAPedir;
            } catch (err) {
                Toast.error(err.message || 'Error al actualizar cantidad');
            }
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Generar PDF con jsPDF                                              */
        /* ══════════════════════════════════════════════════════════════════ */
        function generarPDF(fid, data) {
            if (!window.jspdf) { Toast.error('Librería PDF no cargada'); return; }
            const { jsPDF } = window.jspdf;
            const doc  = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const W    = doc.internal.pageSize.getWidth();

            // ── Encabezado naranja ──
            doc.setFillColor(245, 166, 35);
            doc.rect(0, 0, W, 22, 'F');
            doc.setTextColor(26, 26, 26);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('UNISOF', W / 2, 14, { align: 'center' });

            // ── Subtítulo ──
            doc.setTextColor(80, 80, 80);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text('Orden de Compra a Proveedor', W / 2, 28, { align: 'center' });

            // ── Datos de la factura ──
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('Nº Factura:', 14, 38);
            doc.setFont('helvetica', 'normal');
            doc.text(data.numeroFactura || '—', 46, 38);

            doc.setFont('helvetica', 'bold');
            doc.text('Fecha:', 14, 45);
            doc.setFont('helvetica', 'normal');
            doc.text(formatFecha(data.fechaGeneracion), 46, 45);

            doc.setFont('helvetica', 'bold');
            doc.text('Proveedor:', 14, 52);
            doc.setFont('helvetica', 'normal');
            doc.text((data.proveedorNombre || '—').substring(0, 60), 46, 52);

            doc.setFont('helvetica', 'bold');
            doc.text('NIT:', 14, 59);
            doc.setFont('helvetica', 'normal');
            doc.text(data.proveedorNit || '—', 46, 59);

            // ── Tabla de insumos ──
            const detalles = detalleCache[fid]?.detalles || data.detalles || [];
            const body = detalles.map(d => [
                d.insumoNombre || '—',
                d.unidadMedida || '—',
                formatNum(d.cantidadMinima),
                formatNum(d.cantidadAPedir)
            ]);

            doc.autoTable({
                startY: 66,
                head: [['Insumo', 'Unidad', 'Cant. mínima', 'Cant. a pedir']],
                body: body,
                styles: { fontSize: 9, cellPadding: 4 },
                headStyles: { fillColor: [245, 166, 35], textColor: [26, 26, 26], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [248, 248, 248] },
                columnStyles: {
                    0: { cellWidth: 'auto' },
                    1: { cellWidth: 30 },
                    2: { cellWidth: 35, halign: 'right' },
                    3: { cellWidth: 35, halign: 'right', fontStyle: 'bold' }
                }
            });

            // ── Espacio de firma ──
            const finalY = doc.lastAutoTable.finalY + 20;
            doc.setDrawColor(180, 180, 180);
            doc.line(14, finalY, 80, finalY);
            doc.setFontSize(9);
            doc.setTextColor(120, 120, 120);
            doc.text('Firma Jefe de Compras – UNISOF', 14, finalY + 5);

            doc.line(W - 80, finalY, W - 14, finalY);
            doc.text('Firma y sello Proveedor', W - 80, finalY + 5);

            // ── Pie ──
            doc.setFontSize(8);
            doc.setTextColor(160, 160, 160);
            doc.text('Generado por Sistema UNISOF', W / 2, doc.internal.pageSize.getHeight() - 8, { align: 'center' });

            doc.save(`${data.numeroFactura || 'factura'}.pdf`);
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Enviar factura por correo                                         */
        /* ══════════════════════════════════════════════════════════════════ */
        async function enviarFactura(fid) {
            const btn = document.getElementById(`btn-enviar-${fid}`);
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Enviando…'; }

            try {
                const res  = await fetch(`/api/facturas-proveedor/${fid}/enviar`, {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al enviar');

                Toast.success(data.mensaje || 'Factura enviada correctamente');
                // Invalidar cache y recargar detalle
                delete detalleCache[fid];
                // Actualizar estado en grupos
                grupos.forEach(g => {
                    const f = (g.facturas || []).find(f => f.id === fid);
                    if (f) { f.estado = 'ENVIADA'; f.enviadaAt = data.enviadaAt; }
                });
                await cargarDetalleFactura(fid, { estado: 'ENVIADA' });
                // Actualizar badge en el header
                actualizarBadgeHeader(fid, 'ENVIADA', data.enviadaAt);
            } catch (err) {
                Toast.error(err.message || 'Error al enviar la factura');
                if (btn) { btn.disabled = false; btn.textContent = '✉ Enviar por correo'; }
            }
        }

        function actualizarBadgeHeader(fid, estado, enviadaAt) {
            const card = document.getElementById(`card-${fid}`);
            if (!card) return;
            const metaDiv = card.querySelector('.fp-factura-meta');
            if (!metaDiv) return;
            const badgeSpan = metaDiv.querySelector('.badge-borrador, .badge-enviada');
            if (badgeSpan) badgeSpan.outerHTML = `<span class="badge-enviada">✓ Enviada</span>`;
        }

        /* ══════════════════════════════════════════════════════════════════ */
        /* Logout + sidebar móvil + auth + carga inicial                     */
        /* ══════════════════════════════════════════════════════════════════ */
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (!window.confirm('¿Desea cerrar sesión?')) return;
            await authApi.logout();
            window.location.href = '/';
        });

        const sb = document.getElementById('compras-jefe-sidebar');
        const tg = document.getElementById('compras-jefe-sidebar-toggle');
        if (tg && sb) {
            tg.addEventListener('click', () => {
                sb.classList.toggle('open');
                tg.setAttribute('aria-label', sb.classList.contains('open') ? 'Cerrar menú' : 'Abrir menú');
            });
        }

        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) { window.location.href = '/login.html'; return; }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (!esRolPanelCompras(rol)) { window.location.href = '/'; return; }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent  = result.usuario?.rol || 'Jefe de Compras';

            if (rol === 'ADMINISTRADOR') {
                modoAdmin = true;
                const nav = document.querySelector('#compras-jefe-sidebar .admin-nav');
                if (nav) {
                    nav.innerHTML =
                        '<a href="/panel-admin.html" class="admin-nav-item" data-nav="dashboard">' +
                        '<span class="admin-nav-icon">📊</span><span class="admin-nav-text">Dashboard</span></a>' +
                        '<a href="/personal.html" class="admin-nav-item" data-nav="personal">' +
                        '<span class="admin-nav-icon">👤</span><span class="admin-nav-text">Personal</span></a>' +
                        '<a href="/ordenes.html" class="admin-nav-item" data-nav="ordenes">' +
                        '<span class="admin-nav-icon">📋</span><span class="admin-nav-text">Consultar órdenes de compra</span></a>' +
                        '<a href="/facturas-proveedores.html" class="admin-nav-item active" data-nav="compras">' +
                        '<span class="admin-nav-icon">📦</span><span class="admin-nav-text">Consultar compras insumos</span></a>' +
                        '<a href="/inventario-insumos.html?ctx=admin" class="admin-nav-item" data-nav="inventario">' +
                        '<span class="admin-nav-icon">📁</span><span class="admin-nav-text">Consultar inventario</span></a>' +
                        '<a href="/proveedores.html" class="admin-nav-item" data-nav="proveedores">' +
                        '<span class="admin-nav-icon">🏭</span><span class="admin-nav-text">Proveedores</span></a>';
                }
                const label = document.querySelector('#compras-jefe-sidebar .compras-modulos-label');
                if (label) label.remove();
            }

            await cargarGrupos();
        })();
    </script>
</body>
</html>
