<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Órdenes de Compra — Jefe de Compras | UNISOF">
    <title>Órdenes de Compra — Jefe de Compras | UNISOF</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .oc-section { padding: 24px; }

        /* Toolbar simétrico */
        .oc-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; max-width: 560px; }
        .oc-search-row { display: flex; align-items: center; gap: 10px; }
        .oc-search-row label { width: 100px; flex-shrink: 0; color: #aaa; font-size: 13px; font-weight: 600; text-align: right; }
        .oc-search-row input { flex: 1; padding: 9px 13px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; }
        .oc-search-row input:focus { outline: none; border-color: #f5a623; box-shadow: 0 0 0 2px rgba(245,166,35,0.2); }
        .oc-search-row .oc-btn { width: 120px; flex-shrink: 0; }
        .oc-actions-row { display: flex; gap: 10px; padding-left: 110px; margin-top: 4px; flex-wrap: wrap; }

        /* Botones */
        .oc-btn { padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.15s, opacity 0.15s; white-space: nowrap; }
        .oc-btn-yellow  { background: #f5a623; color: #1a1a1a; }
        .oc-btn-yellow:hover  { background: #e09520; }
        .oc-btn-secondary { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
        .oc-btn-secondary:hover { background: #333; }
        .oc-btn-outline { background: transparent; color: #888; border: 1px solid #444; }
        .oc-btn-outline:hover { background: #2a2a2a; color: #ccc; }

        .oc-page-title { font-size: 20px; font-weight: 700; color: #f5a623; margin: 0 0 24px; display: flex; align-items: center; gap: 10px; }

        /* Tabla de reportes */
        .oc-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2a2a2a; margin-bottom: 16px; }
        .oc-table { width: 100%; border-collapse: collapse; background: #1a1a1a; font-size: 14px; }
        .oc-table th { background: #222; color: #f5a623; font-weight: 700; padding: 11px 14px; text-align: left; border-bottom: 2px solid #2a2a2a; white-space: nowrap; }
        .oc-table td { padding: 10px 14px; border-bottom: 1px solid #242424; color: #ddd; vertical-align: middle; }
        .oc-table tbody tr:hover { background: #202020; }
        .oc-table tbody tr:last-child td { border-bottom: none; }
        .oc-empty-msg { text-align: center; padding: 56px 24px; color: #666; font-size: 14px; }
        .oc-empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }

        /* Botón ver detalle */
        .btn-ver { padding: 5px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; border: 1px solid #f5a623; background: transparent; color: #f5a623; font-weight: 600; white-space: nowrap; transition: background 0.15s, color 0.15s; }
        .btn-ver:hover { background: #f5a623; color: #1a1a1a; }

        /* Panel de detalle expandible */
        .rc-detalle { display: none; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; margin: 0 0 16px; padding: 20px; }
        .rc-detalle.visible { display: block; }
        .rc-detalle-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .rc-detalle-title { font-size: 15px; font-weight: 700; color: #f5a623; }
        .rc-detalle-close { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; padding: 0 4px; }
        .rc-detalle-close:hover { color: #fff; }
        .rc-detalle-ordenes { font-size: 12px; color: #888; margin-bottom: 12px; }
        .rc-detalle-ordenes strong { color: #ddd; }

        /* Tabla de insumos en detalle */
        .rc-ins-table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #2a2a2a; }
        .rc-ins-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #111; }
        .rc-ins-table th { background: #1e1e1e; color: #aaa; font-weight: 700; padding: 9px 13px; text-align: left; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
        .rc-ins-table th.col-cant { color: #f5a623; }
        .rc-ins-table td { padding: 8px 13px; border-bottom: 1px solid #1e1e1e; color: #ddd; }
        .rc-ins-table tbody tr:last-child td { border-bottom: none; }
        .rc-ins-table tbody tr:hover { background: #181818; }
        .rc-ins-table td.cant { text-align: right; font-weight: 700; color: #e05a5a; font-variant-numeric: tabular-nums; }

        @media (max-width: 768px) {
            .oc-toolbar { max-width: 100%; }
            .oc-search-row { flex-direction: column; align-items: stretch; }
            .oc-search-row label { width: auto; text-align: left; }
            .oc-search-row .oc-btn { width: 100%; }
            .oc-actions-row { padding-left: 0; flex-direction: column; }
        }
    </style>
</head>
<body class="compras-jefe-body">

    <aside class="admin-sidebar" id="compras-jefe-sidebar" aria-label="Módulos de compras">
        <div class="admin-sidebar-header">
            <a href="/" class="admin-logo admin-logo--sin-icono" aria-label="UNISOF — Inicio">
                <span class="admin-logo-text">UNISOF</span>
            </a>
        </div>
        <p class="compras-modulos-label">Módulos</p>
        <nav class="admin-nav admin-nav--compras-modulos">
            <a href="/compras.html" class="admin-nav-item" data-nav="dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span class="admin-nav-text">Dashboard</span>
            </a>
            <a href="/ordenes-compras.html" class="admin-nav-item" data-nav="pedidos">

                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>
                </svg>
                <span class="admin-nav-text">Pedidos</span>
            </a>
            <a href="/analisis-insumos.html" class="admin-nav-item" data-nav="analisis">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="8" width="5" height="13" rx="1"/><rect x="17" y="13" width="5" height="8" rx="1"/>
                </svg>
                <span class="admin-nav-text">Análisis de insumos</span>
            </a>
            <a href="/inventario-insumos.html" class="admin-nav-item" data-nav="inventario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>
                </svg>
                <span class="admin-nav-text">Inventario</span>
            </a>
            <a href="/reporte-faltantes.html" class="admin-nav-item" data-nav="reporte">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
                </svg>
                <span class="admin-nav-text">Reporte faltantes</span>
            </a>
            <a href="/ordenes-compra.html" class="admin-nav-item active" data-nav="ordenes-compra">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span class="admin-nav-text">Órdenes de compra</span>
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <div class="admin-user-info">
                <span class="admin-user-name" id="user-name">—</span>
                <span class="admin-user-rol" id="user-rol">Jefe de Compras</span>
            </div>
            <button type="button" class="admin-btn-logout" id="btn-logout">Cerrar sesión</button>
        </div>
    </aside>

    <div class="compras-jefe-main">
        <header class="compras-jefe-topbar" aria-label="Cabecera del panel"></header>

        <div class="compras-jefe-content">
            <div class="oc-section">

                <h1 class="oc-page-title">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex-shrink:0;">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    Órdenes de Compra
                </h1>

                <!-- Toolbar de búsqueda -->
                <div class="oc-toolbar">
                    <div class="oc-search-row">
                        <label for="buscar-fecha">Fecha exacta</label>
                        <input type="date" id="buscar-fecha">
                        <button type="button" class="oc-btn oc-btn-secondary" id="btn-buscar-fecha">Por fecha</button>
                    </div>
                    <div class="oc-search-row">
                        <label for="buscar-mes">Mes</label>
                        <input type="month" id="buscar-mes">
                        <button type="button" class="oc-btn oc-btn-secondary" id="btn-buscar-mes">Por mes</button>
                    </div>
                    <div class="oc-actions-row">
                        <button type="button" class="oc-btn oc-btn-yellow" id="btn-listar-todos">Listar todos</button>
                        <button type="button" class="oc-btn oc-btn-outline" id="btn-limpiar">Limpiar</button>
                    </div>
                </div>

                <!-- Panel de detalle (oculto hasta que se abre) -->
                <div class="rc-detalle" id="rc-detalle-panel">
                    <div class="rc-detalle-header">
                        <span class="rc-detalle-title" id="rc-detalle-title">Detalle del reporte</span>
                        <button type="button" class="rc-detalle-close" id="rc-detalle-close" title="Cerrar">✕</button>
                    </div>
                    <div class="rc-detalle-ordenes" id="rc-detalle-ordenes"></div>
                    <div class="rc-ins-table-wrap">
                        <table class="rc-ins-table">
                            <thead>
                                <tr>
                                    <th>Insumo</th>
                                    <th>Unidad de medida</th>
                                    <th class="col-cant">Cantidad a conseguir</th>
                                </tr>
                            </thead>
                            <tbody id="rc-detalle-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Tabla de reportes consolidados -->
                <div id="oc-contenedor">
                    <div class="oc-empty-msg">
                        <span class="oc-empty-icon">⏳</span>
                        Cargando reportes…
                    </div>
                </div>

            </div>
        </div>
    </div>

    <button type="button" class="compras-jefe-sidebar-toggle" id="compras-jefe-sidebar-toggle" aria-label="Abrir menú">☰</button>

    <script src="/js/auth.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/accessibility.js"></script>
    <script src="/js/unisof-brand-info.js" defer></script>
    <link rel="stylesheet" href="/css/chat.css">
    <script src="/js/chat.js" defer></script>
    <script>
        function esRolPanelCompras(rol) {
            const r = (rol || '').toUpperCase();
            return r === 'JEFE DE COMPRAS' || r === 'JEFE DE VENTAS' || r === 'ADMINISTRADOR';
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }

        function formatFecha(iso) {
            if (!iso) return '—';
            try {
                return new Date(iso).toLocaleDateString('es-CO', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (_) { return iso; }
        }

        function formatNum(val) {
            if (val == null) return '—';
            const n = parseFloat(val);
            if (isNaN(n)) return String(val);
            return n.toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 4 });
        }

        let ultimoContexto = 'todos';

        /* ═══════════════════════════════════════════════════════════════════ */
        /* Cargar lista de reportes consolidados                              */
        /* ═══════════════════════════════════════════════════════════════════ */
        async function cargarReportes(params = {}) {
            const contenedor = document.getElementById('oc-contenedor');
            contenedor.innerHTML = '<div class="oc-empty-msg"><span class="oc-empty-icon">⏳</span>Cargando reportes…</div>';
            document.getElementById('rc-detalle-panel').classList.remove('visible');

            try {
                const qs  = new URLSearchParams(params).toString();
                const res = await fetch('/api/reportes-consolidados' + (qs ? '?' + qs : ''), { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error al cargar');
                renderTabla(Array.isArray(data) ? data : []);
            } catch (err) {
                Toast.error(err.message || 'Error al cargar reportes');
                contenedor.innerHTML = '<div class="oc-empty-msg"><span class="oc-empty-icon">⚠️</span>Error al cargar los reportes.</div>';
            }
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* Renderizar tabla de reportes                                       */
        /* ═══════════════════════════════════════════════════════════════════ */
        function renderTabla(lista) {
            const contenedor = document.getElementById('oc-contenedor');

            if (lista.length === 0) {
                contenedor.innerHTML = `<div class="oc-empty-msg">
                    <span class="oc-empty-icon">📋</span>
                    ${ultimoContexto === 'todos'
                        ? 'No hay reportes consolidados generados aún. Genera uno desde <strong>Reporte faltantes</strong>.'
                        : 'No se encontraron reportes para la búsqueda realizada.'}
                </div>`;
                return;
            }

            let html = `<div class="oc-table-wrap">
                <table class="oc-table">
                    <thead>
                        <tr>
                            <th>Nº reporte</th>
                            <th>Fecha y hora</th>
                            <th>Órdenes incluidas</th>
                            <th>Total insumos distintos</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>`;

            lista.forEach(r => {
                const numPad = String(r.id).padStart(4, '0');
                html += `<tr>
                    <td><strong style="color:#f5a623;">REP-${escapeHtml(numPad)}</strong></td>
                    <td>${formatFecha(r.fecha)}</td>
                    <td style="font-size:12px;color:#aaa;">${escapeHtml(r.ordenesNums || '—')}</td>
                    <td style="text-align:center;"><span style="color:#f5a623;font-weight:700;">${r.totalInsumosDistintos ?? '—'}</span></td>
                    <td><button type="button" class="btn-ver" data-reporte-id="${r.id}" data-reporte-num="${escapeHtml(numPad)}">Ver detalle</button></td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
            contenedor.innerHTML = html;

            // Eventos "Ver detalle"
            contenedor.querySelectorAll('.btn-ver').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id  = btn.dataset.reporteId;
                    const num = btn.dataset.reporteNum;
                    abrirDetalle(id, num);
                });
            });
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* Abrir panel de detalle de un reporte                              */
        /* ═══════════════════════════════════════════════════════════════════ */
        async function abrirDetalle(id, num) {
            const panel = document.getElementById('rc-detalle-panel');
            document.getElementById('rc-detalle-title').textContent = `Reporte REP-${num}`;
            document.getElementById('rc-detalle-ordenes').innerHTML = '<em style="color:#666;">Cargando detalle…</em>';
            document.getElementById('rc-detalle-tbody').innerHTML   = '';
            panel.classList.add('visible');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            try {
                const res  = await fetch(`/api/reportes-consolidados/${id}`, { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje || 'Error');

                // Órdenes incluidas
                const ordenes  = data.ordenes || [];
                const ordenesStr = ordenes.map(o =>
                    `#${String(o.ordenNumero).padStart(3,'0')} — ${escapeHtml(o.clienteNombre || '—')}`
                ).join(', ');
                document.getElementById('rc-detalle-ordenes').innerHTML =
                    `<strong>Órdenes incluidas:</strong> ${escapeHtml(ordenesStr) || '—'}&nbsp;&nbsp;|&nbsp;&nbsp;` +
                    `<strong>Generado:</strong> ${formatFecha(data.fecha)}`;

                // Tabla de insumos
                const insumos = data.insumos || [];
                const tbody = document.getElementById('rc-detalle-tbody');
                if (insumos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#666;padding:16px;">Sin insumos registrados.</td></tr>';
                } else {
                    tbody.innerHTML = insumos.map(ins => `
                        <tr>
                            <td>${escapeHtml(ins.insumoNombre || '—')}</td>
                            <td>${escapeHtml(ins.unidadMedida || '—')}</td>
                            <td class="cant">${formatNum(ins.cantidadTotal)}</td>
                        </tr>`).join('');
                }
            } catch (err) {
                document.getElementById('rc-detalle-ordenes').innerHTML =
                    `<span style="color:#e05a5a;">Error al cargar detalle: ${escapeHtml(err.message)}</span>`;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════ */
        /* Búsquedas                                                          */
        /* ═══════════════════════════════════════════════════════════════════ */
        document.getElementById('btn-listar-todos').addEventListener('click', () => {
            ultimoContexto = 'todos'; cargarReportes();
        });
        document.getElementById('btn-buscar-fecha').addEventListener('click', () => {
            const fecha = document.getElementById('buscar-fecha').value;
            if (!fecha) { Toast.error('Selecciona una fecha'); return; }
            ultimoContexto = 'fecha'; cargarReportes({ fecha });
        });
        document.getElementById('btn-buscar-mes').addEventListener('click', () => {
            const mes = document.getElementById('buscar-mes').value;
            if (!mes) { Toast.error('Selecciona un mes'); return; }
            ultimoContexto = 'mes'; cargarReportes({ mes });
        });
        document.getElementById('btn-limpiar').addEventListener('click', () => {
            document.getElementById('buscar-fecha').value = '';
            document.getElementById('buscar-mes').value   = '';
            ultimoContexto = 'todos'; cargarReportes();
        });
        document.getElementById('rc-detalle-close').addEventListener('click', () => {
            document.getElementById('rc-detalle-panel').classList.remove('visible');
        });

        /* ═══════════════════════════════════════════════════════════════════ */
        /* Logout + sidebar móvil + auth + carga inicial                      */
        /* ═══════════════════════════════════════════════════════════════════ */
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (!window.confirm('¿Desea cerrar sesión?')) return;
            await authApi.logout();
            window.location.href = '/';
        });

        const sb = document.getElementById('compras-jefe-sidebar');
        const tg = document.getElementById('compras-jefe-sidebar-toggle');
        if (tg && sb) {
            tg.addEventListener('click', () => {
                sb.classList.toggle('open');
                tg.setAttribute('aria-label', sb.classList.contains('open') ? 'Cerrar menú' : 'Abrir menú');
            });
        }

        (async () => {
            const result = await authApi.getMe();
            if (!result.ok) { window.location.href = '/login.html'; return; }
            const rol = (result.usuario?.rol || '').toUpperCase();
            if (!esRolPanelCompras(rol)) { window.location.href = '/'; return; }
            document.getElementById('user-name').textContent = result.usuario?.nombre || result.usuario?.usuario;
            document.getElementById('user-rol').textContent  = result.usuario?.rol || 'Jefe de Compras';
            await cargarReportes();
        })();
    </script>
</body>
</html>
