# Perfil Azure - usa variables de entorno del App Service
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.base-url=${APP_BASE_URL}
spring.mail.password=${SPRING_MAIL_PASSWORD}
stripe.secret-key=${STRIPE_SECRET_KEY}
app.payment-provider=${APP_PAYMENT_PROVIDER:stripe}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# Resend (si se usa en lugar de SMTP)
app.resend.from=${APP_RESEND_FROM:UNISOF <noreply@unisof.shop}
