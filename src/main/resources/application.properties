spring.application.name=insumos

# Evita el aviso "Using generated security password" en consola
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Inactividad real la marca el cliente (aviso a 2 min antes del cierre). La sesión en servidor debe
# sobrevivir ese margen sin peticiones; el JS renueva con GET /api/auth/me al interactuar (máx. cada 45 s).
server.servlet.session.timeout=10800s

spring.datasource.url=jdbc:postgresql://localhost:5432/unisof_db
spring.datasource.username=postgres
spring.datasource.password=123456
# Hibernate crea las tablas automaticamente basado en las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Usuario admin inicial (solo si la BD esta vacia)
app.admin.email=alfonso.ocampom@uqvirtual.edu.co
# Copias de recibos: correos que reciben copia (separados por coma)
app.copias.emails=alfonso.ocampom@uqvirtual.edu.co,unisofmelissa@gmail.com

# Restablecer contraseñas: activa solo UNA VEZ, reinicia la app, luego COMENTA estas lineas
# app.security.reset-passwords=true
# app.admin.password=TuContrasenaSegura123!
# app.vendedor.password=OtraContrasenaSegura456!

# Si la red bloquea SMTP: fallback muestra token en consola (app.mail.fallback-log-on-error=true)
# Para evitar ERROR en logs cuando el correo falla, descomenta: app.mail.enabled=false
app.mail.fallback-log-on-error=true

# SCRUM-35: SMTP - Correo DESDE el que SE ENVIAN los tokens
# Base de datos (usuarios.correo) = Correo DONDE RECIBEN los tokens
# Si puerto 587 falla (timeout), probar con port=465 y ssl=true
app.mail.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=unisofmelissa@gmail.com
# Contraseña de aplicación Gmail. Local: definir SPRING_MAIL_PASSWORD en env. Render: agregar en Environment Variables
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
# Timeouts para no bloquear: el token 2FA se envía en segundo plano; fallar rápido si SMTP tarda
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# URL base de la app (para redirección tras el pago)
# Local: http://localhost:8080 | Producción: usa APP_BASE_URL en Render
app.base-url=http://localhost:8080

# Mercado Pago - Access Token. En Render: MERCADOPAGO_ACCESS_TOKEN
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# Pasarela de pago: "mercadopago" o "stripe" (en Render: APP_PAYMENT_PROVIDER)
app.payment-provider=stripe

# Stripe - Clave secreta. En Render: STRIPE_SECRET_KEY
stripe.secret-key=${STRIPE_SECRET_KEY:}

# Nova / OpenAI: definir OPENAI_API_KEY en el entorno ANTES de arrancar (mvnw spring-boot:run).
# Opcional: app.openai.api-key=sk-... aqui (no subir a repositorio publico)
app.openai.enabled=true
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-4o-mini
app.openai.max-tokens=600

# Logging a archivo (se rota automaticamente por Spring Boot)
logging.file.name=logs/unisof-app.log
logging.level.root=INFO

# Prometheus / Actuator: expone /actuator/health y /actuator/prometheus para monitoreo
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
