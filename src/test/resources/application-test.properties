# Perfil "test": BD en memoria (H2) para cargar el contexto Spring sin depender del esquema de PostgreSQL local.
spring.datasource.url=jdbc:h2:mem:unisof_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.mail.enabled=false
logging.file.name=
